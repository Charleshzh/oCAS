# Release-notes configuration for GitHub's auto-generated release notes.
#
# The project releases from direct pushes to `main` (release-plz) rather than
# through pull requests, so auto-generated notes only list merged PRs and will
# normally be sparse. Curated highlights live in the root CHANGELOG.md; mirror
# the relevant CHANGELOG section into the release body when a richer page is
# wanted. This file only decides how *merged PRs* are grouped, by label.
#
# Labels used below that do not exist yet are simply never matched; add them
# when the corresponding area starts producing PRs (e.g. `integration`).
changelog:
  exclude:
    labels:
      - ignore-for-release
      - chore
  categories:
    - title: Integration & Calculus
      labels:
        - integration
        - calculus
        - symbolic-integration
        - differential-equations
        - algorithm
    - title: Algebra & Gröbner
      labels:
        - algebra
        - polynomial
        - groebner
        - algebraic-number-fields
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Performance
      labels:
        - perf
        - performance
        - optimization
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - dependabot
    - title: CI, Build & Release
      labels:
        - ci
        - build
        - release
        - github-actions
    - title: Other
      labels:
        - "*"
