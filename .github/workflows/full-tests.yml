name: full-tests

# Weekly long-running test sweep for the suites whose tests are `#[ignore]`d in
# the normal PR CI because each one takes minutes: the deep correctness cases,
# slow multivariate-factorization proptests, release-mode Gröbner timings, etc.
#
# Design notes (from the 2026-10-25 triage, issue #55):
# - Everything runs in `--release`: the ignored set contains release-mode
#   Gröbner timings and proptests whose debug-mode runtime is an order of
#   magnitude worse (the first debug-mode attempt never left the ocas-poly
#   step inside the 180-minute job budget).
# - Unit suites run one test at a time under a per-test `timeout`: a single
#   pathological proptest shrink must not swallow the whole job, and the log
#   names the test that hung. Suites are ordered so a failure still lets the
#   remaining suites run (`if: always()`).
# - Known gaps are quarantined *explicitly* and tracked in issue #55, so this
#   workflow only turns red on new failures. Shrink the skip lists as fixes land.
# - Gröbner timings print measurements (no assertions); documented-unfinished
#   cases stay manual until the 0.33.0 Gröbner work.
# - Never delete or weaken a test just to make this workflow green.

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-ignored:
    name: Ignored unit tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Long unit tests — ocas-core
        run: cargo test --release -p ocas-core --lib -- --ignored
      - name: Long unit tests — ocas-domain
        run: cargo test --release -p ocas-domain --lib -- --ignored
      - name: Long unit tests — ocas-poly (per-test timeout 900 s)
        run: |
          set -uo pipefail
          TESTS=$(cargo test --release -p ocas-poly --lib -- --ignored --list | sed -n 's/: test$//p')
          rc=0
          for t in $TESTS; do
            echo "=== ocas-poly: $t ==="
            timeout 900 cargo test --release -p ocas-poly --lib -- --exact --ignored "$t" || { echo "::error::ocas-poly test failed or timed out: $t"; rc=1; }
          done
          exit $rc
      - name: Long unit tests — ocas-calc (known gaps quarantined, see issue #55)
        if: always()
        run: |
          set -uo pipefail
          TESTS=$(cargo test --release -p ocas-calc --lib -- --ignored --list | sed -n 's/: test$//p')
          rc=0
          for t in $TESTS; do
            case "$t" in
              *trig_reduction*)
                # P1/P2 atom construction is still being debugged (issue #55 §2):
                # integrate_trig_reduction declines at trig_reduction.rs:1342.
                echo "skipping known gap (issue #55): $t"
                continue
                ;;
            esac
            echo "=== ocas-calc: $t ==="
            timeout 300 cargo test --release -p ocas-calc --lib -- --exact --ignored "$t" || { echo "::error::ocas-calc test failed or timed out: $t"; rc=1; }
          done
          exit $rc

  integration-ignored:
    name: Ignored integration tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # ocas-tests/scripts/*.py (SymPy comparison oracles) run under the
      # uv-managed environment created from ocas-tests/uv.lock.
      - name: Sync Python test environment
        run: |
          cd ocas-tests
          uv sync
      - name: Long Gröbner timing tests (bounded cases only, issue #55 §4)
        run: |
          set -uo pipefail
          TESTS=$(cargo test --release -p ocas-tests --test groebner_timing -- --ignored --list | sed -n 's/: test$//p')
          rc=0
          for t in $TESTS; do
            case "$t" in
              # Documented-unfinished cases (cyclic-7 Lex took >2 h in the
              # 0.27.x gap analysis; multi-modular cyclic-7 / katsura-7 are in
              # the same bucket; F4 cyclic-6 Lex is >6 min locally). They stay
              # manual until the 0.33.0 Gröbner work.
              cyclic_6_fp13|cyclic_7_fp13|f5_cyclic_7_fp13|f5_cyclic_7_fp13_grevlex|f5_katsura_7_fp13|multi_modular_cyclic_7_q)
                echo "skipping known-heavy timing case (issue #55): $t"
                continue
                ;;
            esac
            echo "=== groebner_timing: $t ==="
            timeout 300 cargo test --release -p ocas-tests --test groebner_timing -- --exact --ignored --nocapture "$t" || { echo "::error::gröbner timing failed or timed out: $t"; rc=1; }
          done
          exit $rc
      - name: Long correctness integration tests (known ODE gaps quarantined)
        if: always()
        # Known solver gaps (issue #55 §1) and the >hour f5 cyclic-7 case stay
        # quarantined; everything else must pass.
        run: |
          timeout 3600 cargo test --release -p ocas-tests --test correctness -- --ignored \
            --skip groebner_f5_cyclic_7 \
            --skip ode_bernoulli \
            --skip ode_homogeneous \
            --skip ode_vop_secant_forcing
