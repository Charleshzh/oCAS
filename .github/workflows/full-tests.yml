name: full-tests

# Weekly long-running test sweep for the suites whose tests are `#[ignore]`d in
# the normal PR CI because each one takes minutes: the deep correctness cases,
# slow multivariate-factorization proptests, release-mode Gröbner timings, etc.
#
# Design notes (learned from the first run on 2026-10-25):
# - Everything runs in `--release`: the ignored set contains release-mode
#   Gröbner timings and proptests whose debug-mode runtime is an order of
#   magnitude worse (the first debug-mode attempt never left the ocas-poly
#   step inside the 180-minute job budget).
# - The Gröbner timing suite contains cases that are documented as unfinished
#   (cyclic-7 Lex took >2 h in the 0.27.x gap analysis; katsura-7 and the
#   multi-modular cyclic-7 are in the same bucket). They are skipped here and
#   stay manual until the 0.33.0 Gröbner work lands; the bounded cases still
#   run weekly.
# - Failures are the point of this workflow: triage them, link an issue, and
#   never delete or weaken a test just to make the workflow green.

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-ignored:
    name: Ignored unit tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Long unit tests — ocas-core
        run: cargo test --release -p ocas-core --lib -- --ignored
      - name: Long unit tests — ocas-domain
        run: cargo test --release -p ocas-domain --lib -- --ignored
      - name: Long unit tests — ocas-poly
        run: cargo test --release -p ocas-poly --lib -- --ignored
      - name: Long unit tests — ocas-calc
        run: cargo test --release -p ocas-calc --lib -- --ignored

  integration-ignored:
    name: Ignored integration tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # ocas-tests/scripts/*.py (SymPy comparison oracles) run under the
      # uv-managed environment created from ocas-tests/uv.lock.
      - name: Sync Python test environment
        run: |
          cd ocas-tests
          uv sync
      - name: Long correctness integration tests
        # groebner_f5_cyclic_7 is a known-unfinished >hour case (same bucket as
        # the Gröbner work deferred to 0.33.0); everything else runs.
        run: cargo test --release -p ocas-tests --test correctness -- --ignored --skip groebner_f5_cyclic_7
      - name: Long Gröbner timing tests (bounded cases only)
        # cyclic-7 Lex / katsura-7 / multi-modular cyclic-7 are documented as
        # unfinished (>2 h) in GAP_ANALYSIS; they stay manual until 0.33.0.
        run: |
          cargo test --release -p ocas-tests --test groebner_timing -- --ignored \
            --skip cyclic_7 \
            --skip katsura_7 \
            --skip multi_modular_cyclic_7
